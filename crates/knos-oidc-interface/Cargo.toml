[package]
name = "knos-oidc-interface"
version = "0.3.11"
edition = "2021"
license = "MIT"
description = "Read a GitHub Actions or GitLab CI OIDC token that the knos-oidc program verified on Solana. No dependencies."
repository = "https://github.com/drexthealpha/Knos"
readme = "README.md"
keywords = ["solana", "oidc", "github-actions", "jwt", "no-std"]
categories = ["no-std", "cryptography::cryptocurrencies"]

# Nothing here on purpose: bytes in, values out, so this builds with solana-program, pinocchio or anchor of any
# version, on chain and off.
[dependencies]

[features]
# alloc: adds Text::to_vec. The default build does not allocate.
alloc = []

# The tests read the expected claims with an independent JSON parser.
[dev-dependencies]
serde_json = "1"
