name: agent-pr-index

# The Agent PR Index: scans 2,000+ pull requests by AI coding agents whose description says tests or CI pass, and
# records what CI actually said at each head commit (too slow for the Pages build). It publishes index.json as the
# asset of a GitHub Release tagged index-<date> (a release is not a data commit); the Pages build (network.yml)
# downloads the newest one and re-checks its Merkle root. With only the default token the search budget is tight;
# KNOS_INDEX_TOKEN (a read-only PAT) lifts it. A scan that keeps too few PRs publishes nothing, so the last good
# release stays live.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write  # create the index-<date> release; nothing is committed
  actions: write   # start network.yml

concurrency:
  group: agent-pr-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: API cache (search pages and CI verdicts; reruns resume)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/knos-agent-pr-ci
          key: agent-pr-ci-${{ github.run_id }}
          restore-keys: agent-pr-ci-
      - name: scan
        # a PAT, when set, has the 5,000/h core budget the scan needs; the default token has 1,000/h per repo
        run: python scripts/agent_pr_index.py scan --rows rows.json --max-seconds 15000
        env:
          GH_TOKEN: ${{ secrets.KNOS_INDEX_TOKEN || github.token }}
      - name: build index.json
        run: python scripts/agent_pr_index.py build --rows rows.json --out index.json
      - name: release index-<date> (skipped when the scan kept under 2,000 PRs)
        run: |
          n=$(python -c "import json; print(json.load(open('index.json'))['n_prs'])")
          if [ "$n" -lt 2000 ]; then echo "only $n PRs; the last release stays live"; exit 0; fi
          tag="index-$(date -u +%Y-%m-%d-%H%M)"
          root=$(python -c "import json; print(json.load(open('index.json'))['root'])")
          gh release create "$tag" index.json --title "Agent PR Index $tag" --latest=false             --notes "Agent PR Index: $n PRs, Merkle root $root. Recompute it: python scripts/agent_pr_index.py check --out index.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pages build (a release made with GITHUB_TOKEN triggers no workflow, so start it explicitly)
        run: gh workflow run network.yml --ref main -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
