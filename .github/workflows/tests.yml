name: tests

# PRs and main stay under 5 minutes of wall time: uv with a cache, pytest -n auto, the Solana CLI pinned and cached,
# mac and windows on 3.12 only, and 10 property rounds. The full matrix runs nightly; the 200 property rounds run
# nightly in fuzz.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: v2.3.13

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
        shard: ["1/1"]
        exclude: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"os":"windows-latest"}]' || '[{"os":"macos-latest","python":"3.10"},{"os":"windows-latest"}]') }}
        # Windows runs the suite in two halves at once (its runner is the slowest): 3.12 on PRs, both nightly.
        include: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"os":"windows-latest","python":"3.10","shard":"1/2"},{"os":"windows-latest","python":"3.10","shard":"2/2"},{"os":"windows-latest","python":"3.12","shard":"1/2"},{"os":"windows-latest","python":"3.12","shard":"2/2"}]' || '[{"os":"windows-latest","python":"3.12","shard":"1/2"},{"os":"windows-latest","python":"3.12","shard":"2/2"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      # The suite is offline: conftest.py refuses every non-loopback connection and gives each test its own home.
      - run: pytest -q -n auto
        env:
          KNOS_SHARD: ${{ matrix.shard }}
      # The 30-second story, on every OS: the wheel installs into a clean venv, and `knos init` wires a fresh home,
      # starts the server, passes its self-test, and undoes cleanly.
      - name: wheel installs and knos init works in a clean home
        shell: bash
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/clean" -q
          if [ -d "$RUNNER_TEMP/clean/bin" ]; then BIN="$RUNNER_TEMP/clean/bin"; else BIN="$RUNNER_TEMP/clean/Scripts"; fi
          VIRTUAL_ENV="$RUNNER_TEMP/clean" uv pip install -q dist/*.whl
          export PATH="$BIN:$PATH" HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.cursor"
          start=$(date +%s)
          knos init --hosts cursor --no-read
          echo "init took $(( $(date +%s) - start ))s"
          test $(( $(date +%s) - start )) -le 30
          knos init --undo --hosts cursor

  # Every number in the README opening, the home hero, the submission and the pitch script is checked against devnet,
  # GitHub or a file in the repo (scripts/claims_check.py).
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q solders
      - run: python scripts/claims_check.py
        env:
          GH_TOKEN: ${{ github.token }}

  # Nothing unused ships: every module is reached from an entry point, and vulture finds no unused code beyond the
  # framework-called names listed (with reasons) in scripts/vulture_whitelist.py.
  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e . vulture==2.14
      - run: python scripts/deadcode.py
      - run: vulture src/knos scripts --min-confidence 60

  # The team registry against the real programs: a local validator with the devnet-deployed Solana Attestation Service
  # and Lighthouse cloned into it (scripts/devchain.sh). The claim protocol's property test runs 10 rounds here and
  # 200 nightly (fuzz.yml).
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: solana-${{ env.SOLANA_VERSION }}-${{ runner.os }}
      - name: Solana CLI (pinned, cached)
        run: |
          [ -x "$HOME/.local/share/solana/install/active_release/bin/solana" ] || sh -c "$(curl -sSfL https://release.anza.xyz/$SOLANA_VERSION/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: bash scripts/devchain.sh start
      - run: pytest -q -m "" tests/test_sas.py tests/test_team_protocol.py tests/test_team_two_homes.py tests/test_team_records.py tests/test_chain_budgets.py tests/test_bench_chain.py tests/test_network_stats.py tests/test_team_property.py
        env:
          KNOSTEST_PROPERTY_N: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: TypeScript SDK (two agents over the Knos MCP server)
        run: |
          cd sdk/ts && npm install --no-audit --no-fund
          R="$RUNNER_TEMP/tsrepo"; mkdir -p "$R" && cd "$R" && git init -q && echo x > a.txt && git add -A && git commit -qm init
          cd "$GITHUB_WORKSPACE/sdk/ts" && KNOS_TEST_REPO="$R" node test.mjs
