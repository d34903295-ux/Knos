name: release

# Everything a release publishes, behind one gate.
#
# A release starts by pushing its tag, and only that way:  git tag v0.3.12 && git push origin v0.3.12
#
#   tests           THE GATE: the whole test workflow (tests.yml, called as a reusable workflow) on the tagged commit,
#                   in this very run. Every job below needs it, so nothing leaves the repository unless the full
#                   suite passed on that exact commit. Tagging early cannot skip it: the tag only starts the tests.
#   build           the wheel, the sdist and the npm tarball of the JavaScript client (sdk/settle), once; the tag must
#                   be the version each of them carries.
#   pypi            uploads the wheel and the sdist. First by PyPI trusted publishing: PyPI accepts the upload on
#                   this run's GitHub OIDC token, so there is no API token to store. When that fails or is not set
#                   up on pypi.org, the second way is the repository secret PYPI_API_TOKEN, if there is one. When
#                   neither works the job fails and its message names both ways.
#   github-release  creates the GitHub release for the tag, with the wheel, the sdist and the npm tarball attached
#                   (`npm i https://github.com/drexthealpha/Knos/releases/download/vX.Y.Z/knos-settle-X.Y.Z.tgz`).
#   registry        lists `knos mcp` in the official MCP registry (registry.modelcontextprotocol.io). It proves it owns
#                   the io.github.drexthealpha namespace with this run's GitHub OIDC token; the registry checks the
#                   PyPI package names the same server (the `mcp-name:` line at the end of README.md), so it runs
#                   after pypi. A version the registry already has is left alone.
#   gemini          attaches the Gemini CLI extension to the release, once for each platform, under the names Gemini
#                   CLI looks for (<platform>.<extension name>.tar.gz). `gemini extensions install <repository>` reads
#                   the latest release and takes a release's only asset for the extension: with these beside the
#                   knos-settle tarball the install is one step.
#   crates, npmjs   publish the Rust interface crate to crates.io and the JavaScript client to npm, each only when its
#                   registry token is a secret of this repository (CARGO_REGISTRY_TOKEN, NPM_TOKEN). A first publish
#                   on either registry needs its owner to sign in there and create that token. Without the secret the
#                   job says so in one line and passes: the crate installs as a git dependency and the client from
#                   the release tarball (docs/INSTALL.md). A version the registry already has is left alone.
#   site            starts the Pages build (a release made with GITHUB_TOKEN triggers no workflow).
#
# The secrets here are the two registry tokens and the optional PYPI_API_TOKEN, each read by one step of one job.
# Before 0.3.12 the wheel was
# uploaded to PyPI by hand and this workflow ran when a release was published, so both could happen (and did) while
# the tests of that commit were failing or still running. Publishing a release by hand now starts nothing: a job that
# waits for a release event, or reads one, would never run.
#
# Once, by the owner of the PyPI project, for the gate to be the only way in: on pypi.org, knos > Publishing, add the
# trusted publisher (owner drexthealpha, repository Knos, workflow release.yml, environment pypi), then delete the
# project's API tokens. Until the trusted publisher exists, a token stored as the secret PYPI_API_TOKEN (a token
# for the knos project only) lets this workflow publish; delete the secret as well once trusted publishing works.
#
# A run that failed half way is run again from the Actions page ("Re-run failed jobs"), or with "Run workflow" on the
# tag: each job skips what is already published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false      # what is built here is what gets published: nothing is restored into it
      - name: the tag is the version of everything this publishes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)" = "$version"
          test "$(jq -r .version server.json)" = "$version"
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
          test "$(jq -r .version sdk/settle/package.json)" = "$version"
      - name: wheel, sdist and npm tarball
        run: |
          set -euo pipefail
          uv build
          (cd sdk/settle && npm pack --pack-destination ../../dist)
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, the first way
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false      # this job signs and uploads: nothing is restored into it
      # The first way. It does not fail the job when PyPI says no: the next step decides, so that the token is never
      # in the environment of this attempt and the log of this step says why PyPI refused.
      - name: upload to PyPI by trusted publishing (files it already has are skipped, so a second run is safe)
        id: trusted
        run: |
          if uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PyPI::Trusted publishing did not work (the output above says why). Trying the secret PYPI_API_TOKEN next."
          fi
      # The second way, only when the first did not work, and only if the repository has the secret.
      - name: upload to PyPI with the secret PYPI_API_TOKEN (only when trusted publishing did not work)
        if: steps.trusted.outputs.done != 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "::error title=PyPI::The upload to PyPI did not work, and there is no other way in. Fix one of the two: (1) trusted publishing: on pypi.org open the knos project, Publishing, and add a trusted publisher with owner drexthealpha, repository Knos, workflow release.yml, environment pypi; or (2) a token: create an API token for the knos project on pypi.org and store it as the repository secret PYPI_API_TOKEN. Then run this job again."
            exit 1
          fi
          uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz

  github-release:
    needs: [tests, build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist
      - name: the release, with this version's part of the changelog as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v head="## $version" 'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --title "Knos $version" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi

  registry:
    needs: [tests, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: publish server.json unless the registry already has this version
        run: |
          set -euo pipefail
          name=$(jq -r .name server.json); version=$(jq -r .version server.json)
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
          # the registry reads the PyPI page of this exact version for the mcp-name line: wait for PyPI to have it
          for _ in $(seq 30); do
            if curl -fsS "https://pypi.org/pypi/knos/$version/json" | jq -e --arg n "mcp-name: $name" '.info.description | contains($n)' > /dev/null; then break; fi
            echo "PyPI does not show knos $version with the mcp-name line yet"; sleep 20
          done
          curl -fsS "https://pypi.org/pypi/knos/$version/json" | jq -e --arg n "mcp-name: $name" '.info.description | contains($n)' > /dev/null
          if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$name" \
               | jq -e --arg n "$name" --arg v "$version" '[.servers[]? | (.server // .) | select(.name == $n and .version == $v)] | length > 0' > /dev/null; then
            echo "$name $version is already in the registry"; exit 0
          fi
          url=$(curl -fsS https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
                  | jq -r '.assets[].browser_download_url | select(test("linux") and test("amd64|x86_64") and test("tar.gz$"))' | head -1)
          test -n "$url"
          curl -fsSL "$url" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  gemini:
    needs: [tests, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pack the extension, attach it once for each platform
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name=$(jq -r .name gemini-extension.json)
          test "v$(jq -r .version gemini-extension.json)" = "$TAG"   # Gemini CLI shows this version beside the release's tag
          tar -czf "linux.$name.tar.gz" gemini-extension.json
          cp "linux.$name.tar.gz" "darwin.$name.tar.gz"
          cp "linux.$name.tar.gz" "win32.$name.tar.gz"
          gh release upload "$TAG" "linux.$name.tar.gz" "darwin.$name.tar.gz" "win32.$name.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  crates:
    needs: [tests, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: publish knos-oidc-interface to crates.io, when CARGO_REGISTRY_TOKEN exists
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice title=crates.io::Skipped: this repository has no CARGO_REGISTRY_TOKEN secret, so knos-oidc-interface $TAG was not published to crates.io."
            exit 0
          fi
          cd crates/knos-oidc-interface
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$TAG"
          # crates.io's index lists every published version of a crate, one JSON line each (no such file: none yet)
          if curl -fs https://index.crates.io/kn/os/knos-oidc-interface | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
            echo "crates.io already has knos-oidc-interface $version"; exit 0
          fi
          cargo publish --locked

  npmjs:
    needs: [tests, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write   # the provenance npm records with the package: this run packed it from this commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: publish knos-settle to npm, when NPM_TOKEN exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice title=npm::Skipped: this repository has no NPM_TOKEN secret, so knos-settle $TAG was not published to npm."
            exit 0
          fi
          cd sdk/settle
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$TAG"
          if [ "$(npm view "knos-settle@$version" version 2>/dev/null)" = "$version" ]; then
            echo "npm already has knos-settle $version"; exit 0
          fi
          node test.mjs
          # npm reads the token from the environment when it runs: the file holds only the variable's name
          # shellcheck disable=SC2016  # so the shell must not expand it
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish --provenance --access public

  site:
    needs: [tests, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Pages build (a release made with GITHUB_TOKEN triggers no workflow, so start it explicitly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run network.yml --ref main --repo "$GITHUB_REPOSITORY"
