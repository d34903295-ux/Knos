name: program

# The two Solana programs, built and tested from source in Actions:
#
#   build-test      cargo build-sbf (pinned, cached agave) for knos-oidc, knos-pay and the example consumer; the test
#                   binaries replace tests/fixtures, so the LiteSVM tests run against THIS commit's source; then the
#                   Wycheproof RSA vectors (cargo test), the differential test against OpenSSL, the attack tests, and
#                   10,000 random steps over every knos-pay instruction (no money lost or created, nothing stuck).
#   cargo-audit     RustSec advisories against the lockfile. No ignores.
#   verified-build  `solana-verify build` (pinned docker image) for each program: the reproducible binary. These
#                   artifacts are what gets deployed, once, and then made immutable; `knos mainnet-check` compares
#                   the on-chain bytes with them.
#
# Nothing here deploys. The programs have no upgrade authority, so there is nothing for CI to upgrade.
on:
  workflow_dispatch:
  push:
    paths: ["programs/**", "examples/oidc_gate/**", "src/knos/settle/**", "tests/_settle.py", "tests/test_oidc_*.py", "tests/test_pay_chain.py", "scripts/build_programs.sh", ".github/workflows/program.yml"]
  schedule:
    - cron: "41 3 * * *"

concurrency:
  group: program-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOLANA_VERSION: v2.3.13
  # agave 2.3 platform tools (rustc 1.84) for solana-verify; its default image is rustc 1.79, too old for the lockfile
  VERIFY_IMAGE: solanafoundation/solana-verifiable-build:2.3.11

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          key: agave-${{ env.SOLANA_VERSION }}-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/target
            examples/oidc_gate/target
          key: cargo-sbf-${{ hashFiles('programs/Cargo.lock', 'examples/oidc_gate/Cargo.lock') }}
          restore-keys: cargo-sbf-
      - name: agave (pinned, cached)
        run: |
          [ -x "$HOME/.local/share/solana/install/active_release/bin/solana" ] || sh -c "$(curl -sSfL https://release.anza.xyz/$SOLANA_VERSION/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Wycheproof RSA vectors against the verifier's own arithmetic (2048- and 4096-bit)
        run: cd programs/knos_oidc && cargo test --release -- --nocapture
      - name: cargo build-sbf (both programs, the example, and the test binaries)
        run: bash scripts/build_programs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: programs
          path: |
            programs/target/deploy/knos_oidc.so
            programs/target/deploy/knos_pay.so
      - uses: actions/upload-artifact@v4
        with:
          name: test-fixtures
          path: tests/fixtures/*.so
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"
      - name: the programs in LiteSVM (prints the compute units of each verification step)
        run: pytest -q -s tests/test_oidc_chain.py tests/test_pay_chain.py tests/test_settle_relay.py tests/test_oidc_gate.py
      - name: fuzz, 10,000 steps
        run: KNOS_FUZZ_SEED=$GITHUB_RUN_ID pytest -q -s tests/test_pay_chain.py -k random_walk
        env:
          KNOS_FUZZ_N: "10000"
      - name: the pinned issuer keys are still the issuers' (a key they added since must come in through the rotate workflow)
        run: python scripts/oidc_pins.py

  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (the workspace's one lockfile covers both programs; any vulnerability fails the job)
        run: |
          cd programs && cargo audit

  verified-build:
    # The deployed binaries are THESE: `solana-verify build` in a pinned docker image, so `solana-verify
    # verify-from-repo` reproduces them byte for byte. cargo build-sbf on the runner differs (toolchain paths are
    # embedded), which is why build-test's binaries are only tested, never deployed.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        program: [knos_oidc, knos_pay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-0.4
      - name: solana-verify
        run: |
          [ -x "$HOME/.cargo/bin/solana-verify" ] || cargo install --locked solana-verify
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: solana-verify build (docker)
        run: |
          solana-verify build "$GITHUB_WORKSPACE/programs" --library-name ${{ matrix.program }} --base-image "$VERIFY_IMAGE"
          echo "executable hash: $(solana-verify get-executable-hash programs/target/deploy/${{ matrix.program }}.so)"
          sha256sum programs/target/deploy/${{ matrix.program }}.so
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.program }}-verified.so
          path: programs/target/deploy/${{ matrix.program }}.so
