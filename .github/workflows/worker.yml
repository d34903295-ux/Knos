name: always-on worker

# Knos's relay, in public. Repositories that installed Knos (examples/knos-workflow.yml) post GitHub-signed tokens as
# comments; this job finds them (src/knos/proof/ghrelay.py), carries each to Solana devnet, where knos-oidc verifies
# GitHub's signature and knos-pay does what the token says, and pays the transaction fees. It also releases tests-mode
# payments whose review window has passed and refunds bounties past their deadline. It decides nothing: the money goes
# where the token says, and anyone can run the same command (`knos relay`).
#
# One step relays for about 4.5 minutes, a pass every 3 seconds (`knos relay --serve`: a pass that finds nothing new
# costs GitHub one conditional request per repository it knows), then starts the next run itself (GitHub's cron is only
# a restart safety net).
# The one secret is the fee-paying key; it holds devnet SOL for fees and nobody's money.
# This job sees that secret, so nothing it installs comes from an Actions cache (`enable-cache: false`): a cache can be
# written by other runs of this repository. The one cache step below keeps the relay's own notes (the repositories it
# found tokens in), which are read as data and never run.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: always-on-worker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # each run starts the next
  issues: write       # the relay log: one line per token relayed, in the open issue labelled knos-relay

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KNOS_HOME: ${{ github.workspace }}/.knos-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv pip install --system -e .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .knos-home
          key: knos-relay-home-${{ github.run_id }}
          restore-keys: knos-relay-home-
      - name: relay for about 4.5 minutes, a pass every 3 s
        env:
          KNOS_RELAY_KEY: ${{ secrets.KNOS_RELAY_KEY || secrets.KNOS_WORKER_KEY }}
          GH_TOKEN: ${{ github.token }}
          KNOS_RELAY_LOG_REPO: ${{ github.repository }}
        run: |
          [ -n "$KNOS_RELAY_KEY" ] || { echo "no KNOS_RELAY_KEY secret: skipped"; exit 0; }
          knos relay --serve 280 || true
      - name: start the next run (always on)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run worker.yml --repo "$GITHUB_REPOSITORY" --ref main
