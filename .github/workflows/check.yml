name: knos check

# A reusable workflow: the free check, for every pull request, with no bounty and no money involved. A repository calls
# it from a `pull_request_target` workflow (template: examples/knos-check.yml), pinned to a full commit sha.
#
# It runs `knos proof gate`, which runs none of the pull request's code:
#   - the description's own claims: a "tests pass" or "CI is green" is compared with GitHub's record of the head
#     commit's finished checks, and refused when one failed;
#   - the repository's own rules (CONTRIBUTING.md);
#   - what this repository's history made required: a rule broken or a false claim caught before is remembered in
#     Sibyl's local store, carried in this repository's Actions cache, and held against the next pull request.
#
# contents: read and checks: read only. No id-token, no secret, no wallet, nothing on any chain. The result is the
# status "check / claims" on the pull request; a branch ruleset can require it. To also pay for merged work, use
# examples/knos-workflow.yml instead (it includes this check).
on:
  workflow_call:
    outputs:
      passed:
        description: "true when the pull request's claims and the repository's rules hold"
        value: ${{ jobs.claims.outputs.passed }}

permissions: {}

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - name: checkout the base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: the pull request's diff and description (nothing in it is run)
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NUM: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$HEAD" in *[!0-9a-f]*|"") echo "no pull request head sha"; exit 1;; esac
          git -C base fetch --no-tags origin "+refs/pull/$NUM/head:refs/knos/head"
          test "$(git -C base rev-parse refs/knos/head)" = "$HEAD"
          git -C base diff "$BASE...$HEAD" > pr.diff
          printf '%s' "$BODY" > body.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: install knos at this workflow's own commit
        env:
          REF: ${{ job.workflow_sha }}
          REPO: ${{ job.workflow_repository }}
          UV_EXCLUDE_NEWER: "2026-10-05T00:00:00Z"   # the judge's dependencies as published by this release, never newer
        run: |
          case "$REF" in
            "") uv pip install --system "knos==0.3.11" ;;
            *[!0-9a-f]*) echo "job.workflow_sha is not a commit sha"; exit 1 ;;
            *) uv pip install --system "knos @ git+https://github.com/${REPO:-drexthealpha/Knos}@$REF" ;;
          esac
      - name: the judge's memory of this repo, from this repo's Actions cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/.knos-memory
          key: knos-judge-sibyl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: knos-judge-sibyl-
      - name: knos proof gate
        id: gate
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if knos proof gate --base base --diff pr.diff --evidence evidence.json --store "$RUNNER_TEMP/.knos-memory" \
               --repo "$GITHUB_REPOSITORY" --agent "$AUTHOR" --body-file body.md --head "$HEAD" --wait 600; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Knos: this pull request's claims do not hold"
              jq -r '.reasons[]? | "- " + .' evidence.json
            } >> "$GITHUB_STEP_SUMMARY"
            # learned only from a refusal that ran no pull request code, so the pull request cannot have written it
            if jq -e '[.reasons[] | select(startswith("repo rule:") or startswith("claim:"))] | length > 0' \
                 evidence.json > /dev/null; then echo "learn=true" >> "$GITHUB_OUTPUT"; fi
            exit 1
          fi
      - name: remember what was learned
        if: always() && steps.gate.outputs.learn == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/.knos-memory
          key: knos-judge-sibyl-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knos-evidence
          path: evidence.json
          if-no-files-found: ignore
