name: knos fund

# A reusable workflow. A repository's own knos.yml (examples/knos-workflow.yml) calls it for a comment that has a line
# starting with /knos, and for a new issue whose description funds it. It is one job: install knos, run one command.
# The command holds all the logic and is tested without GitHub:
#
#     knos command --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"
#
# It reads the comment, does what it says and always answers with a comment: fund and tip (fix the bounty's terms,
# choose the balance that pays, ask GitHub for a token, have it carried to Solana), take and release (assign the
# issue), and for every other command the reply itself. `/knos help` lists the commands.
#
# What GitHub signs here. knos-pay (the second deployment) opens a bounty only on a GitHub Actions OIDC token whose
# audience is
#
#     knos2:fund:<issue>:<amount units>:<mode>:<terms hash>:<work seconds>:<balance address>
#
# from a file named fund.yml, in a run that a comment or a new issue started (`issue_comment`, `issues`), on a
# GitHub-hosted runner, in the run's first attempt. GitHub also signs who commented (`actor_id`): only the owner of
# the balance, or a spender the owner listed, can spend it with a comment. The job on chain records this file's
# repository and commit (`job_workflow_ref`, `job_workflow_sha`); from then on only prove.yml of the same repository
# at the same commit can pay it. Running a failed run again mints a token the chain refuses (GitHub signs a re-run
# with the first run's actor, whoever pressed the button): comment again instead.
#
# How GitHub runs this, which the design rests on:
#   - A reusable workflow called from another repository sees the caller's event: `github.event`, the file at
#     $GITHUB_EVENT_PATH, `github.repository` and the job's token are all the calling repository's.
#   - `issue_comment` and `issues` run the workflow file of the calling repository's default branch, with that
#     repository's token, also when the comment is on a pull request from a fork, and whoever commented: anyone who
#     can comment starts this job. So it checks out nothing and runs nothing from the repository or a pull request;
#     what people wrote reaches the command as a file, never a shell; and who may do what is decided by the command
#     (GitHub's answer about that person's access) and, where money moves, by the chain from GitHub's signature.
#   - Only a new comment and a newly opened issue count (the job's own condition), whatever events a caller listens
#     for: an edit can be made by someone who is not the author.
#   - It takes no inputs: nothing a caller passes can change which code runs here. A caller chooses when to call it,
#     and nothing else. Its one output tells the caller that a payment should be tried next; it decides no payment.
#
# The one secret is optional. With KNOS_RELAY_KEY (a Solana key that pays transaction fees; it never holds a
# bounty's money) the job carries its own token to Solana. Without it the token is posted as a comment and Knos's
# public relay (worker.yml in drexthealpha/Knos) carries it; anyone else can. The token is public on purpose: it
# names one action, the chain takes it once, and the signature on it is GitHub's.
#
# The install, the same two steps in every Knos job: uv at a version whose checksum the pinned setup-uv action
# checks, then knos as the one exact requirement named below (a release on PyPI), with dependencies no newer than
# UV_EXCLUDE_NEWER, ignoring any uv configuration in the working directory. The runner is ubuntu-24.04 by name: its
# image has Python 3.12, and `ubuntu-latest` is being moved to Ubuntu 26.04. No job here restores or saves an Actions
# cache (`enable-cache: false`, and `cache-mode: read` on every job): a cache written by a run of pull request code
# could be read by a job that signs, so every run downloads what it installs.
on:
  workflow_call:
    secrets:
      KNOS_RELAY_KEY:
        description: >-
          Optional. A Solana key that pays transaction fees, so this run carries its own token to Solana. Without it
          the token is posted as a comment and Knos's public relay carries it.
        required: false
    outputs:
      settle:
        description: >-
          The number of the pull request whose payment should be tried now (`/knos settle`, or a tip that was just
          funded); empty otherwise. The calling file runs prove.yml when it is set.
        value: ${{ jobs.command.outputs.settle }}

permissions: {}

jobs:
  command:
    if: >-
      (github.event_name == 'issue_comment' && github.event.action == 'created') ||
      (github.event_name == 'issues' && github.event.action == 'opened')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # one command at a time for an issue or a pull request, each in its turn (GitHub keeps up to 100 waiting), so a
    # comment is not dropped because another one came in
    concurrency:
      group: knos-command-${{ github.event.issue.number }}
      queue: max
    cache-mode: read
    permissions:
      contents: read          # the repository's files, read through GitHub's API (there is no checkout)
      issues: write           # the reply; assigning an issue for /knos take
      pull-requests: write    # the reply, when the comment is on a pull request
      checks: read            # which checks the repository runs: a bounty's terms name them
      statuses: read          # the same, for checks that report as commit statuses
      actions: read           # which event starts each check's workflow
      id-token: write         # the fund token
    outputs:
      settle: ${{ steps.command.outputs.settle }}
    steps:
      - name: uv, with no cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false      # nothing is restored into a job that runs here, and nothing is saved from it
          ignore-empty-workdir: true
      - name: install knos, this one requirement exactly
        env:
          UV_EXCLUDE_NEWER: "2026-10-10T00:00:00Z"
        run: uv tool install --no-config "knos==0.3.12"
      - name: knos command
        id: command
        env:
          GH_TOKEN: ${{ github.token }}
          KNOS_RELAY_KEY: ${{ secrets.KNOS_RELAY_KEY }}
        run: knos command --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"
