[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knos"
version = "0.2.0"
description = "One local memory every coding agent on the machine shares — and it knows which of them is in your code right now."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "drexthealpha", email = "zulibro1999@gmail.com" }]
keywords = ["memory", "agents", "mcp", "local-first", "coordination"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  # The server is built on MCPServer, which arrived in 2.0 when FastMCP was
  # renamed. A 1.x resolution installs cleanly and then fails on import, so
  # the floor has to say 2.
  "mcp>=2.0",
  # The memory engine: every answer knos gives comes out of a Sibyl store.
  "sibyl-memory-client>=0.8.1",
]

[project.optional-dependencies]
# Knos Pro: licence signatures are Ed25519; a terminal QR for `knos pro buy`.
pro = ["cryptography>=42", "qrcode>=7"]
# Agent budget wallets paying APIs over HTTP 402, through the protocols' reference SDKs:
# MPP on Tempo (pympp, Python 3.11+) and x402 on Solana.
agentpay = [
  "cryptography>=42",
  "httpx>=0.27",
  "pympp[tempo]>=0.11,<0.12; python_version >= '3.11'",
  "x402[svm]>=2.24,<3",
  # x402 2.24 imports solana.rpc.api, which solana 0.40 removed
  "solana>=0.36,<0.40",
]
dev = [
  "pytest>=7",
  "knos[pro,agentpay]",
]

[project.scripts]
knos = "knos.cli:main"

[project.urls]
Homepage = "https://github.com/drexthealpha/Knos"
Repository = "https://github.com/drexthealpha/Knos"
Issues = "https://github.com/drexthealpha/Knos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/knos"]

[tool.hatch.build.targets.sdist]
include = ["src/knos", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` runs everything: a default that quietly deselects most tests reads
# as green while they never ran. The critical path, in seconds, is an explicit
# choice: `pytest -m critical`.
markers = [
  "critical: claims, the edit guard, concurrency, no-network, the four tools, private files",
]
