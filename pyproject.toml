[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knos"
version = "0.3.10"
description = "AI agent work gets paid only when GitHub's own signature, checked by Solana, proves it passed. Two immutable Solana programs with no admin; a free Stop hook for coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "drexthealpha", email = "zulibro1999@gmail.com" }]
keywords = ["proof", "verification", "claude-code-hooks", "ai-agents", "bounties", "escrow", "solana", "oidc", "github-actions", "agent-payments", "sibyl", "coding-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  # The memory engine: what the Stop hook and the judge learn is kept in a Sibyl store, and nowhere else.
  "sibyl-memory-client>=0.8.1",
  # Solana: instructions and transactions are built and signed with solders.
  "solders>=0.29",
  # .knos/proof.toml is read with tomllib, which arrived in 3.11.
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-xdist>=3",
  "pyyaml>=6",
  # the differential test: the on-chain RSA verifier against OpenSSL
  "cryptography>=42",
]

[project.scripts]
knos = "knos.cli:main"

[project.urls]
Homepage = "https://github.com/drexthealpha/Knos"
Repository = "https://github.com/drexthealpha/Knos"
Issues = "https://github.com/drexthealpha/Knos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/knos"]

[tool.hatch.build.targets.sdist]
include = ["src/knos", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
