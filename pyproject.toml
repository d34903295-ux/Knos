[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knos"
version = "0.3.4"
description = "AI agent work counts only when Knos proves it: your coding agent cannot say done, and a hired agent cannot get paid, until the proof is real. Proof hooks for coding agents; paid-on-proof escrow on Solana and Tempo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "drexthealpha", email = "zulibro1999@gmail.com" }]
keywords = ["proof", "verification", "claude-code-hooks", "ai-agents", "hire-ai-agents", "escrow", "solana", "tempo", "blinks", "solana-actions", "mcp", "agent-payments", "agent-reputation", "sibyl", "agent-memory", "coding-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  # The server is built on MCPServer, which arrived in 2.0 when FastMCP was
  # renamed. A 1.x resolution installs cleanly and then fails on import, so
  # the floor has to say 2.
  "mcp>=2.0",
  # The memory engine: every answer knos gives comes out of a Sibyl store.
  "sibyl-memory-client>=0.8.1",
  # Teams on Solana: transactions are built and signed with solders, the team salt is sealed to each member with
  # PyNaCl, and root keys are encrypted with scrypt + AES-GCM from cryptography.
  "solders>=0.29",
  "pynacl>=1.5",
  "cryptography>=42",
  # .knos/proof.toml is read with tomllib, which arrived in 3.11.
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# Knos Pro: licence signatures are Ed25519; a terminal QR for `knos pro buy`.
pro = ["cryptography>=42", "qrcode>=7",
       # chain-enforced agent budgets on Tempo: Tempo's own SDK builds and signs Keychain (0x76) transactions
       "pytempo>=0.5,<0.6"]
# Framework agents: Sibyl's own LangGraph BaseStore plus LangGraph (examples/langgraph_team.py)
langgraph = ["sibyl-memory-langgraph>=0.2", "langgraph>=0.3"]
# Agent budget wallets paying APIs over HTTP 402: MPP on Tempo through its reference SDK (pympp, Python 3.11+).
# x402 on Solana is built in with solders (the reference x402 SDK pins solana<0.40, which pins solders<0.28).
agentpay = [
  "cryptography>=42",
  "httpx>=0.27",
  "pympp[tempo]>=0.11,<0.12; python_version >= '3.11'",
]
dev = [
  "pytest>=7",
  "pytest-xdist>=3",
  "knos[pro,agentpay,langgraph]",
]

[project.scripts]
knos = "knos.cli:main"

[project.urls]
Homepage = "https://github.com/drexthealpha/Knos"
Repository = "https://github.com/drexthealpha/Knos"
Issues = "https://github.com/drexthealpha/Knos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/knos"]

[tool.hatch.build.targets.sdist]
include = ["src/knos", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the fast suite (target under 5 minutes with -n auto): no validator, no live network, no long
# property runs. `pytest -m ""` runs everything: the CI chain job does that against a local validator
# (scripts/devchain.sh); `-m live` talks to public devnet/testnet.
addopts = "-m 'not chain and not live and not slow'"
markers = [
  "critical: claims, the edit guard, concurrency, no-network, the agent tools, private files",
  "chain: needs a local validator (scripts/devchain.sh start)",
  "live: talks to a public devnet/testnet RPC",
  "slow: long property and fuzz runs (nightly)",
]
